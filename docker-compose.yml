services:
  postgres:
    image: postgres:16
    container_name: invoice_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - invoice_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Folder-watch workflow (n8n/workflows/invoice_pipeline.json). Calls the pipeline API (src/api.py)
  # on the host at host.docker.internal:8765. The inbox is mounted read-only: the API moves files.
  n8n:
    image: n8nio/n8n:2.47.2
    container_name: invoice_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /data/inbox
      GENERIC_TIMEZONE: UTC
      # idle polls run every 30 s; keep the execution list short
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "2000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - invoice_n8n_data:/home/node/.n8n
      - ./data/inbox:/data/inbox:ro

volumes:
  invoice_pg_data:
  invoice_n8n_data:
